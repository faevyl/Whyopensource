<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Why Revived Lite</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111'/%3E%3Ctext x='32' y='46' font-family='Arial' font-size='38' font-weight='900' text-anchor='middle' fill='%23fff'%3EW%3F%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#f5f5f7;--surface:#fff;--surface2:#ececef;--text:#111;--text-dim:#666;
    --border:#d9d9de;--accent:#111;--accent-text:#fff;--radius:8px;
  }
  html[data-theme="mono"]{
    --bg:#f5f5f7;--surface:#fff;--surface2:#ececef;--text:#111;--text-dim:#666;
    --border:#d9d9de;--accent:#111;--accent-text:#fff;
  }
  html[data-theme="dark"]{
    --bg:#0d0d0f;--surface:#17171a;--surface2:#202024;--text:#eee;--text-dim:#999;
    --border:#2c2c31;--accent:#fff;--accent-text:#111;
  }
  html[data-theme="sky"]{
    --bg:#e8f2fb;--surface:#fff;--surface2:#dcebf8;--text:#123;--text-dim:#5a7a95;
    --border:#c3d9ea;--accent:#1a7fd4;--accent-text:#fff;
  }
  html[data-theme="purple"]{
    --bg:#f0eafa;--surface:#fff;--surface2:#e6ddf5;--text:#221533;--text-dim:#7a6a92;
    --border:#d5c8ea;--accent:#7c3aed;--accent-text:#fff;
  }
  html[data-theme="green"]{
    --bg:#eaf7ef;--surface:#fff;--surface2:#dbf0e2;--text:#0e2b16;--text-dim:#5f8a6a;
    --border:#c3e2cd;--accent:#16a34a;--accent-text:#fff;
  }
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}

  /* ── top bar ── */
  .topbar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
  .topbar .brand{font-weight:800;font-size:13px;letter-spacing:.2px;margin-right:4px;white-space:nowrap}
  .topbar .brand b{font-weight:900}
  .navbtn{min-width:32px;height:32px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:var(--radius);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-appearance:none;transition:background .15s,opacity .15s}
  .navbtn:hover{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
  .navbtn:disabled{opacity:.35;cursor:default;background:var(--surface2);color:var(--text)}
  .urlwrap{flex:1;display:flex;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .urlwrap:focus-within{border-color:var(--accent)}
  .urlwrap input{flex:1;min-width:0;padding:8px 10px;background:transparent;border:none;outline:none;color:var(--text);font-size:13px;-webkit-appearance:none}
  .gobtn{height:32px;padding:0 14px;border:none;background:var(--accent);color:var(--accent-text);font-weight:700;font-size:13px;cursor:pointer;-webkit-appearance:none;border-radius:0}
  .gobtn:hover{opacity:.9}

  /* ── tab bar ── */
  .tabbar{display:flex;align-items:center;gap:4px;padding:5px 8px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{display:flex;align-items:center;gap:6px;max-width:160px;min-width:70px;padding:5px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;flex-shrink:0;-webkit-appearance:none;transition:background .15s}
  .tab.active{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
  .tab .tt{flex:1;overflow:hidden;text-overflow:ellipsis;min-width:0;text-align:left}
  .tab .tx{font-size:13px;line-height:1;padding:0 2px;border-radius:50%;cursor:pointer;flex-shrink:0;-webkit-appearance:none;background:none;border:none;color:inherit}
  .tab .tx:hover{opacity:.7}
  .newtab{width:28px;height:28px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:var(--radius);font-size:15px;cursor:pointer;flex-shrink:0;-webkit-appearance:none;display:flex;align-items:center;justify-content:center}
  .newtab:hover{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}

  /* ── main ── */
  .main{flex:1;position:relative;display:flex;flex-direction:column}
  iframe#frame{flex:1;width:100%;border:0;background:#fff}

  /* ── home ── */
  .home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;position:absolute;inset:0;background:var(--bg);z-index:1;transition:opacity .25s,visibility .25s}
  .home.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .logo{font-size:34px;font-weight:900;letter-spacing:.5px}
  .tagline{font-size:12px;color:var(--text-dim);margin-top:-12px}
  .hsearch{width:100%;max-width:440px;display:flex;background:var(--surface);border:1px solid var(--border);border-radius:999px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .hsearch input{flex:1;min-width:0;padding:11px 16px;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;-webkit-appearance:none}
  .hsearch button{border:none;background:var(--accent);color:var(--accent-text);font-weight:700;padding:0 20px;cursor:pointer;font-size:13px;-webkit-appearance:none}
  .ql{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:480px}
  .ql a{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;background:var(--surface);border:1px solid var(--border);border-radius:999px;color:var(--text);font-size:12px;font-weight:600;text-decoration:none;cursor:pointer;transition:background .15s,border-color .15s}
  .ql a:hover{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
  .ql a .qi{font-weight:800}

  /* ── settings panel ── */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;opacity:0;visibility:hidden;transition:opacity .2s}
  .mask.open{opacity:1;visibility:visible}
  .panel{position:fixed;top:0;right:0;bottom:0;width:280px;max-width:85vw;background:var(--surface);z-index:21;box-shadow:-8px 0 30px rgba(0,0,0,.15);padding:16px;overflow-y:auto;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;gap:14px}
  .panel.open{transform:translateX(0)}
  .panel h2{font-size:15px;font-weight:800}
  .panel .close{position:absolute;top:12px;right:12px;width:28px;height:28px;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:50%;cursor:pointer;font-size:14px;-webkit-appearance:none}
  .sec{display:flex;flex-direction:column;gap:10px}
  .sec h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-dim)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
  .row input[type=text]{flex:1;min-width:0;padding:7px 9px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:12px;outline:none;-webkit-appearance:none}
  .swatches{display:flex;flex-wrap:wrap;gap:8px}
  .sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--border);cursor:pointer;transition:transform .12s,border-color .12s;-webkit-appearance:none}
  .sw:hover{transform:scale(1.08)}
  .sw.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;-webkit-appearance:none;transition:background .15s}
  .btn:hover{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
  .footer{position:fixed;bottom:0;left:0;right:0;height:26px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:var(--surface);border-top:1px solid var(--border);font-size:11px;color:var(--text-dim);z-index:5}
  .footer .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--text-dim);margin-right:6px}
</style>
</head>
<body>

<div class="topbar">
  <span class="brand">Why<b>Lite</b></span>
  <button class="navbtn" id="backBtn" title="Back">&#8592;</button>
  <button class="navbtn" id="fwdBtn" title="Forward">&#8594;</button>
  <button class="navbtn" id="reloadBtn" title="Reload">&#8635;</button>
  <div class="urlwrap"><input id="urlInput" placeholder="Search or enter URL..." autocomplete="off" spellcheck="false"><button class="gobtn" id="goBtn">Go</button></div>
  <button class="navbtn" id="homeBtn" title="Home">&#8962;</button>
  <button class="navbtn" id="settingsBtn" title="Settings">&#9881;</button>
</div>

<div class="tabbar" id="tabbar">
  <div class="tabs" id="tabs" style="display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none"></div>
  <button class="newtab" id="newTabBtn" title="New Tab">+</button>
</div>

<div class="main">
  <iframe id="frame" sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads allow-pointer-lock allow-fullscreen" allow="fullscreen"></iframe>
  <div class="home" id="home">
    <div class="logo">WhyLite</div>
    <div class="tagline">just a proxy. that's it.</div>
    <div class="hsearch"><input id="homeSearch" placeholder="Search or enter URL..." autocomplete="off" spellcheck="false"><button id="homeGo">Go</button></div>
    <div class="ql" id="quickLinks"></div>
  </div>
</div>

<div class="footer">
  <span><span class="dot" id="connDot"></span><span id="statusText">ready</span></span>
  <span>whylite</span>
</div>

<div class="mask" id="mask"></div>
<div class="panel" id="panel">
  <h2>Settings</h2>
  <button class="close" id="panelClose">&times;</button>

  <div class="sec">
    <h3>Theme</h3>
    <div class="swatches" id="swatches"></div>
  </div>

  <div class="sec">
    <h3>Colors</h3>
    <div class="row"><span>Accent</span><input type="color" id="accentColor" value="#111111" style="width:44px;height:30px;padding:0;border:1px solid var(--border);border-radius:6px;background:none;cursor:pointer"></div>
    <div class="row"><span>Custom accent?</span><label class="btn" style="position:relative"><input type="checkbox" id="customAccent" style="opacity:0;position:absolute;inset:0;cursor:pointer"> toggle</label></div>
  </div>

  <div class="sec">
    <h3>Proxy</h3>
    <div class="row"><span>Worker</span><input type="text" id="proxyUrl" value="https://young-glitter-de54.faevyl.workers.dev/?url="></div>
    <div class="row"><span>Fallback</span><input type="text" id="proxyUrl2" value="https://curly-block-f81c.faevyl.workers.dev/?url="></div>
    <div class="row"><span>Search Engine</span>
      <select id="searchEngine" style="flex:1;padding:7px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:12px">
        <option value="brave">Brave</option>
        <option value="google">Google</option>
        <option value="duckduckgo">DuckDuckGo</option>
        <option value="wikipedia">Wikipedia</option>
        <option value="bing">Bing</option>
      </select>
    </div>
    <div class="row"><span>Force Device</span>
      <select id="forceDevice" style="flex:1;padding:7px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:12px">
        <option value="auto">Auto</option>
        <option value="mobile">Mobile</option>
        <option value="pc">PC</option>
      </select>
    </div>
  </div>

  <div class="sec">
    <h3>Quick Links</h3>
    <textarea id="qlEdit" rows="5" style="flex:1;min-height:90px;padding:8px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:12px;resize:vertical"></textarea>
    <div style="display:flex;gap:8px">
      <button class="btn primary" id="qlSave" style="flex:1">Save</button>
      <button class="btn" id="qlReset" style="flex:1">Reset</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var STORE = 'why_lite_v1';
  var SEARCH = {
    brave: 'https://search.brave.com/search?q=',
    google: 'https://www.google.com/search?q=',
    duckduckgo: 'https://duckduckgo.com/?q=',
    wikipedia: 'https://en.wikipedia.org/w/index.php?fulltext=1&search=',
    bing: 'https://www.bing.com/search?q='
  };
  var DEFAULT_QL = [
    ['G','Google','https://www.google.com'],
    ['YT','YouTube','https://www.kamtape.com'],
    ['W','Wikipedia','https://www.wikipedia.org'],
    ['R','Reddit','https://www.reddit.com'],
    ['GH','GitHub','https://www.github.com'],
    ['D','DuckDuckGo','https://www.duckduckgo.com']
  ];

  // ── settings ──
  var settings = load();
  function load(){
    try{ var s = JSON.parse(localStorage.getItem(STORE)); if(s && s.theme) return s; }catch(e){}
    return { theme:'mono', accent:'#111111', customAccent:false, proxyUrl:'https://young-glitter-de54.faevyl.workers.dev/?url=', proxyUrl2:'https://curly-block-f81c.faevyl.workers.dev/?url=', engine:'brave', device:'auto', ql:null };
  }
  function save(){ try{ localStorage.setItem(STORE, JSON.stringify(settings)); }catch(e){} }

  var ql = settings.ql || DEFAULT_QL.map(function(x){ return { icon:x[0], name:x[1], url:x[2] }; });

  function applyTheme(){
    document.documentElement.setAttribute('data-theme', settings.theme);
    if(settings.customAccent){
      document.documentElement.style.setProperty('--accent', settings.accent);
      document.documentElement.style.setProperty('--accent-text', pickText(settings.accent));
    } else {
      document.documentElement.style.removeProperty('--accent');
      document.documentElement.style.removeProperty('--accent-text');
    }
  }
  function pickText(hex){
    var n = parseInt(hex.slice(1),16);
    var r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    return (r*0.299+g*0.587+b*0.114) > 150 ? '#111' : '#fff';
  }

  // ── theming ui ──
  var THEMES = [
    ['mono','Monochrome','#f5f5f7'],
    ['dark','Dark','#0d0d0f'],
    ['sky','Sky','#e8f2fb'],
    ['purple','Purple','#f0eafa'],
    ['green','Green','#eaf7ef']
  ];
  var swWrap = document.getElementById('swatches');
  THEMES.forEach(function(t){
    var b = document.createElement('button');
    b.className = 'sw' + (settings.theme===t[0]?' active':'');
    b.title = t[1];
    b.style.background = t[2];
    b.onclick = function(){
      settings.theme = t[0]; save(); applyTheme();
      document.querySelectorAll('.sw').forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
    };
    swWrap.appendChild(b);
  });

  var accentInput = document.getElementById('accentColor');
  var customAccent = document.getElementById('customAccent');
  accentInput.value = settings.accent;
  customAccent.checked = settings.customAccent;
  accentInput.addEventListener('input', function(){ settings.accent = this.value; if(settings.customAccent){ save(); applyTheme(); } });
  customAccent.addEventListener('change', function(){ settings.customAccent = this.checked; save(); applyTheme(); });

  // ── proxy ──
  var proxyUrl = document.getElementById('proxyUrl');
  var proxyUrl2 = document.getElementById('proxyUrl2');
  var engineSel = document.getElementById('searchEngine');
  var deviceSel = document.getElementById('forceDevice');
  proxyUrl.value = settings.proxyUrl;
  proxyUrl2.value = settings.proxyUrl2;
  engineSel.value = settings.engine;
  deviceSel.value = settings.device;
  function saveProxy(){
    settings.proxyUrl = proxyUrl.value || 'https://young-glitter-de54.faevyl.workers.dev/?url=';
    settings.proxyUrl2 = proxyUrl2.value || 'https://curly-block-f81c.faevyl.workers.dev/?url=';
    settings.engine = engineSel.value;
    settings.device = deviceSel.value;
    save();
  }
  proxyUrl.addEventListener('change', saveProxy);
  proxyUrl2.addEventListener('change', saveProxy);
  engineSel.addEventListener('change', saveProxy);
  deviceSel.addEventListener('change', saveProxy);

  function activeWorker(){
    return settings.proxyUrl || 'https://young-glitter-de54.faevyl.workers.dev/?url=';
  }
  function workerBase(){
    return activeWorker().replace(/\?url=.*$/,'').replace(/\/+$/,'');
  }
  function b64e(s){ return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
  function buildProxy(raw){
    var w = workerBase();
    var tok = b64e(raw);
    var u = w + '/?__pot=' + encodeURIComponent(tok);
    if(settings.device === 'mobile') u += '&mode=force_mobile';
    else if(settings.device === 'pc') u += '&mode=force_pc';
    return u;
  }

  // ── navigation + tabs ──
  var frame = document.getElementById('frame');
  var home = document.getElementById('home');
  var urlInput = document.getElementById('urlInput');
  var statusText = document.getElementById('statusText');
  var connDot = document.getElementById('connDot');
  var tabs = [{ title:'New Tab', url:'', savedSrc:'about:blank' }];
  var activeTab = 0;
  var historyStack = [], historyPos = -1;

  function switchTab(i){
    if(i === activeTab) return;
    if(frame.src && frame.src !== 'about:blank') tabs[activeTab].savedSrc = frame.src;
    activeTab = i;
    renderTabs();
    var t = tabs[i];
    if(t.url){
      home.classList.add('hidden');
      urlInput.value = t.url;
      frame.src = t.savedSrc || buildProxy(t.url);
      setStatus('ready');
    } else {
      home.classList.remove('hidden');
      urlInput.value = '';
      frame.src = 'about:blank';
    }
  }
  function newTab(){
    tabs.push({ title:'New Tab', url:'', savedSrc:'about:blank' });
    switchTab(tabs.length-1);
  }
  function closeTab(i){
    if(tabs.length <= 1) return;
    tabs.splice(i, 1);
    if(activeTab >= tabs.length) activeTab = tabs.length-1;
    switchTab(activeTab);
  }
  function renderTabs(){
    var c = document.getElementById('tabs');
    c.innerHTML = '';
    tabs.forEach(function(t, i){
      var el = document.createElement('button');
      el.className = 'tab' + (i===activeTab?' active':'');
      var tt = document.createElement('span');
      tt.className = 'tt';
      tt.textContent = t.title || 'New Tab';
      el.appendChild(tt);
      var x = document.createElement('span');
      x.className = 'tx';
      x.textContent = '\u00D7';
      x.onclick = function(e){ e.stopPropagation(); closeTab(i); };
      el.appendChild(x);
      el.onclick = function(){ switchTab(i); };
      c.appendChild(el);
    });
  }

  function go(url){
    if(!url) return;
    url = url.trim();
    if(/^[a-z]+:\/\//i.test(url) === false && !/^\/\//.test(url)){
      if(/^[^\s]+\.[a-z]{2,}/i.test(url) && url.indexOf(' ') === -1) url = 'https://' + url;
      else {
        var se = SEARCH[settings.engine] || SEARCH.brave;
        url = se + encodeURIComponent(url);
      }
    }
    tabs[activeTab].url = url;
    tabs[activeTab].title = url;
    tabs[activeTab].savedSrc = buildProxy(url);
    urlInput.value = url;
    home.classList.add('hidden');
    frame.src = buildProxy(url);
    renderTabs();
    if(historyPos < historyStack.length-1) historyStack = historyStack.slice(0, historyPos+1);
    historyStack.push(url); historyPos = historyStack.length-1;
    updateNav();
    setStatus('loading');
  }
  function setStatus(s){
    statusText.textContent = s;
    connDot.style.background = s==='loading' ? '#f59e0b' : s==='error' ? '#ef4444' : '#22c55e';
  }
  function updateNav(){
    document.getElementById('backBtn').disabled = historyPos <= 0;
    document.getElementById('fwdBtn').disabled = historyPos >= historyStack.length-1;
  }

  document.getElementById('goBtn').onclick = function(){ go(urlInput.value); };
  document.getElementById('homeGo').onclick = function(){ go(document.getElementById('homeSearch').value); };
  urlInput.addEventListener('keydown', function(e){ if(e.key==='Enter') go(urlInput.value); });
  document.getElementById('homeSearch').addEventListener('keydown', function(e){ if(e.key==='Enter') go(document.getElementById('homeSearch').value); });
  document.getElementById('backBtn').onclick = function(){ if(historyPos>0){ historyPos--; go(historyStack[historyPos]); } };
  document.getElementById('fwdBtn').onclick = function(){ if(historyPos<historyStack.length-1){ historyPos++; go(historyStack[historyPos]); } };
  document.getElementById('reloadBtn').onclick = function(){ if(frame.src && frame.src !== 'about:blank'){ frame.src = frame.src; setStatus('loading'); } };
  document.getElementById('homeBtn').onclick = function(){ home.classList.remove('hidden'); urlInput.value=''; setStatus('ready'); };
  document.getElementById('newTabBtn').onclick = newTab;

  frame.addEventListener('load', function(){ setStatus('ready'); });

  // ── quick links ──
  function renderQL(){
    var c = document.getElementById('quickLinks');
    c.innerHTML = '';
    ql.forEach(function(q){
      if(!q || !q.url) return;
      var a = document.createElement('a');
      a.innerHTML = '<span class="qi">' + (q.icon||'') + '</span>' + (q.name||q.url);
      a.href = '#'; a.dataset.url = q.url;
      a.onclick = function(e){ e.preventDefault(); go(q.url); };
      c.appendChild(a);
    });
  }
  var qlEdit = document.getElementById('qlEdit');
  function fillQLEdit(){ qlEdit.value = ql.map(function(q){ return (q.icon||'')+','+(q.name||'')+','+q.url; }).join('\n'); }
  document.getElementById('qlSave').onclick = function(){
    var out = [];
    qlEdit.value.split('\n').forEach(function(line){
      line = line.trim(); if(!line) return;
      var p = line.split(',').map(function(s){ return s.trim(); });
      if(!p[2]) return;
      out.push({ icon:p[0], name:p[1]||p[2], url:p[2] });
    });
    if(out.length){ ql = out; settings.ql = ql; save(); renderQL(); }
  };
  document.getElementById('qlReset').onclick = function(){
    ql = DEFAULT_QL.map(function(x){ return { icon:x[0], name:x[1], url:x[2] }; });
    settings.ql = ql; save(); renderQL(); fillQLEdit();
  };

  // ── settings panel ──
  var mask = document.getElementById('mask');
  var panel = document.getElementById('panel');
  function openPanel(){ saveProxy(); fillQLEdit(); mask.classList.add('open'); panel.classList.add('open'); }
  function closePanel(){ mask.classList.remove('open'); panel.classList.remove('open'); }
  document.getElementById('settingsBtn').onclick = openPanel;
  document.getElementById('panelClose').onclick = closePanel;
  mask.onclick = closePanel;
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closePanel(); });

  // ── ping (csp-friendly img probe) ──
  function ping(){
    var base = workerBase();
    var img = new Image();
    img.onload = function(){ setStatus('ready'); };
    img.onerror = function(){ setStatus('worker unreachable'); };
    img.src = base + '/__why/ping.gif?_=' + Date.now();
  }
  setInterval(ping, 30000);
  setTimeout(ping, 1000);

  applyTheme();
  renderQL();
  renderTabs();
  updateNav();
  setStatus('ready');
})();
</script>
</body>
</html>
